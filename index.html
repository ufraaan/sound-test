<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound Test</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%230a0a0a' d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #ededed;
      --fg-dim: #737373;
      --border: #262626;
      --accent: #fff;
      --accent-dim: #404040;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --fg: #0a0a0a;
      --fg-dim: #737373;
      --border: #e5e5e5;
      --accent: #000;
      --accent-dim: #cccccc;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Geist', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }

    h1 {
      font-size: 14px;
      font-weight: 500;
      color: var(--fg-dim);
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    .theme-toggle {
      position: absolute;
      top: 24px;
      right: 24px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg-dim);
      padding: 8px 12px;
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .theme-toggle:hover {
      border-color: var(--fg-dim);
      color: var(--fg);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 800px;
    }

    .cell {
      background: var(--bg);
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      min-height: 180px;
    }

    .cell-label {
      font-size: 12px;
      color: var(--fg-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .cell-sublabel {
      font-size: 11px;
      color: var(--fg-dim);
      opacity: 0.6;
    }

    .btn {
      font-family: 'Geist Mono', monospace;
      font-size: 13px;
      padding: 10px 20px;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      border-color: var(--fg-dim);
      background: var(--fg-dim);
      color: var(--bg);
    }

    .btn.active {
      background: var(--fg);
      color: var(--bg);
      border-color: var(--fg);
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .status {
      font-family: 'Geist Mono', monospace;
      font-size: 24px;
      color: var(--fg);
      min-height: 32px;
    }

    .status-dim {
      color: var(--fg-dim);
      font-size: 14px;
    }

    .meter {
      width: 100%;
      max-width: 200px;
      height: 8px;
      background: var(--border);
      position: relative;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      background: var(--fg);
      width: 0%;
      transition: width 0.05s ease;
    }

    .freq-control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .freq-inputs {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .freq-inputs input {
      font-family: 'Geist Mono', monospace;
      font-size: 13px;
      width: 80px;
      padding: 8px 12px;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
      text-align: center;
    }

    .freq-inputs input:focus {
      outline: none;
      border-color: var(--fg-dim);
    }

    .freq-inputs span {
      color: var(--fg-dim);
      font-size: 13px;
    }

.footer {
  margin-top: 32px;
  font-size: 12px;
  color: var(--fg-dim);
}

.desc {
  font-size: 13px;
  color: var(--fg-dim);
  text-align: center;
  max-width: 500px;
  line-height: 1.6;
  margin-top: 32px;
}

@media (max-width: 600px) {
  body {
    padding: 32px 16px;
  }

  h1 {
    margin-bottom: 32px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .cell {
    padding: 24px 16px;
    min-height: 140px;
  }

  .btn-row {
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    padding: 12px 16px;
  }

  .freq-inputs {
    flex-wrap: wrap;
    justify-content: center;
  }

  .freq-inputs input {
    width: 100px;
  }

  .desc {
    margin-top: 24px;
    padding: 0 16px;
  }
}
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()">Light</button>
  <h1>Sound Test</h1>

  <div class="grid">
    <div class="cell">
      <span class="cell-label">Channels</span>
      <div class="btn-row">
        <button class="btn" onclick="soundTest.playChannel('left')">L</button>
        <button class="btn" onclick="soundTest.playChannel('both')">L+R</button>
        <button class="btn" onclick="soundTest.playChannel('right')">R</button>
      </div>
      <span class="status" id="channel-status">—</span>
    </div>

    <div class="cell">
      <span class="cell-label">Phase</span>
      <div class="btn-row">
        <button class="btn" onclick="soundTest.playPhase()">Test</button>
      </div>
      <span class="status" id="phase-status">—</span>
      <span class="cell-sublabel">Check speaker polarity</span>
    </div>

    <div class="cell">
      <span class="cell-label">Volume</span>
      <button class="btn" id="mic-btn" onclick="soundTest.toggleMic()">Start</button>
      <div class="meter">
        <div class="meter-fill" id="meter-fill"></div>
      </div>
      <span class="cell-sublabel">Microphone input</span>
    </div>

    <div class="cell" style="grid-column: span 3;">
      <span class="cell-label">Frequency Sweep</span>
      <div class="freq-control">
        <div class="freq-inputs">
          <input type="number" id="freq-start" value="20" min="1" max="20000" placeholder="Start">
          <span>→</span>
          <input type="number" id="freq-end" value="20000" min="1" max="20000" placeholder="End">
          <span>Hz</span>
        </div>
        <div class="btn-row">
          <button class="btn" id="sweep-btn" onclick="soundTest.toggleSweep()">Start Sweep</button>
        </div>
        <span class="status" id="sweep-freq">—</span>
        <span class="status-dim" id="sweep-time">—</span>
      </div>
    </div>
  </div>

  <p class="desc">
    Test your audio setup with different sound tests.<br><br>
    If you hear no sound, check your system volume and ensure the page has permission to play audio.<br><br>
    <span style="color: var(--fg);">Use headphones for channel and phase tests.</span>
  </p>

  <script>
    const soundTest = (() => {
      let audioCtx = null;
      let sweepOsc = null;
      let sweepGain = null;
      let sweepTimeout = null;
      let sweepRunning = false;
      let micStream = null;
      let micAnalyser = null;
      let micAnimation = null;

      function getAudioContext() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playChannel(channel) {
        const ctx = getAudioContext();
        stopSweep();

        const panner = ctx.createStereoPanner();
        panner.connect(ctx.destination);

        const osc = ctx.createOscillator();
        const gainNode = ctx.createGain();

        osc.connect(gainNode);
        gainNode.connect(panner);

        osc.frequency.value = 440;
        gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);

        if (channel === 'left') {
          panner.pan.value = -1;
          document.getElementById('channel-status').textContent = 'Left';
        } else if (channel === 'right') {
          panner.pan.value = 1;
          document.getElementById('channel-status').textContent = 'Right';
        } else {
          panner.pan.value = 0;
          document.getElementById('channel-status').textContent = 'Both';
        }

        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 1.5);
      }

      function playPhase() {
        const ctx = getAudioContext();
        stopSweep();

        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        const gain2 = ctx.createGain();

        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);

        osc1.frequency.value = 200;
        osc2.frequency.value = 200;

        gain1.gain.setValueAtTime(0.5, ctx.currentTime);
        gain2.gain.setValueAtTime(0.5, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2);
        gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2);

        osc1.start(ctx.currentTime);
        osc2.start(ctx.currentTime);
        osc1.stop(ctx.currentTime + 2);
        osc2.stop(ctx.currentTime + 2);

        setTimeout(() => {
          document.getElementById('phase-status').textContent = 'In Phase';
        }, 800);
      }

      function stopSweep() {
        if (sweepOsc) {
          sweepOsc.stop();
          sweepOsc.disconnect();
          sweepOsc = null;
        }
        if (sweepGain) {
          sweepGain.disconnect();
          sweepGain = null;
        }
        if (sweepTimeout) {
          clearTimeout(sweepTimeout);
          sweepTimeout = null;
        }
        sweepRunning = false;
        document.getElementById('sweep-btn').textContent = 'Start Sweep';
        document.getElementById('sweep-btn').classList.remove('active');
      }

      function playChannel(channel) {
        const ctx = getAudioContext();
        stopSweep();

        const panner = ctx.createStereoPanner();
        panner.connect(ctx.destination);

        const osc = ctx.createOscillator();
        const gainNode = ctx.createGain();

        osc.connect(gainNode);
        gainNode.connect(panner);

        osc.frequency.value = 440;
        gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);

        if (channel === 'left') {
          panner.pan.value = -1;
          document.getElementById('channel-status').textContent = 'Left';
        } else if (channel === 'right') {
          panner.pan.value = 1;
          document.getElementById('channel-status').textContent = 'Right';
        } else {
          panner.pan.value = 0;
          document.getElementById('channel-status').textContent = 'Both';
        }

        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 1.5);
      }

      function playPhase() {
        const ctx = getAudioContext();
        stopSweep();

        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        const gain2 = ctx.createGain();

        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);

        osc1.frequency.value = 200;
        osc2.frequency.value = 200;

        gain1.gain.setValueAtTime(0.5, ctx.currentTime);
        gain2.gain.setValueAtTime(0.5, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2);
        gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2);

        osc1.start(ctx.currentTime);
        osc2.start(ctx.currentTime);
        osc1.stop(ctx.currentTime + 2);
        osc2.stop(ctx.currentTime + 2);

        setTimeout(() => {
          document.getElementById('phase-status').textContent = 'In Phase';
        }, 800);
      }

      function toggleMic() {
        const btn = document.getElementById('mic-btn');
        
        if (micStream) {
          micStream.getTracks().forEach(track => track.stop());
          micStream = null;
          micAnalyser = null;
          cancelAnimationFrame(micAnimation);
          btn.textContent = 'Start';
          btn.classList.remove('active');
          document.getElementById('meter-fill').style.width = '0%';
          return;
        }

        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
          micStream = stream;
          const source = getAudioContext().createMediaStreamSource(stream);
          micAnalyser = getAudioContext().createAnalyser();
          micAnalyser.fftSize = 256;
          source.connect(micAnalyser);

          btn.textContent = 'Stop';
          btn.classList.add('active');
          updateMeter();
        }).catch(() => {
          alert('Microphone access denied');
        });
      }

      function updateMeter() {
        if (!micAnalyser) return;

        const data = new Uint8Array(micAnalyser.frequencyBinCount);
        micAnalyser.getByteFrequencyData(data);

        let sum = 0;
        for (let i = 0; i < data.length; i++) {
          sum += data[i];
        }
        const avg = sum / data.length;
        const percent = Math.min(100, (avg / 128) * 100);

        document.getElementById('meter-fill').style.width = percent + '%';
        micAnimation = requestAnimationFrame(updateMeter);
      }

      function toggleSweep() {
        const btn = document.getElementById('sweep-btn');
        
        if (sweepRunning) {
          stopSweep();
          document.getElementById('sweep-freq').textContent = '—';
          document.getElementById('sweep-time').textContent = '—';
          return;
        }

        const ctx = getAudioContext();
        const startFreq = parseInt(document.getElementById('freq-start').value) || 20;
        const endFreq = parseInt(document.getElementById('freq-end').value) || 20000;
        const duration = 10;
        const steps = 100;
        const stepDuration = duration / steps;
        const freqStep = (endFreq - startFreq) / steps;

        sweepOsc = ctx.createOscillator();
        sweepGain = ctx.createGain();
        
        sweepOsc.type = 'sine';
        sweepOsc.connect(sweepGain);
        sweepGain.connect(ctx.destination);
        sweepGain.gain.value = 0.3;

        sweepOsc.frequency.setValueAtTime(startFreq, ctx.currentTime);

        let currentStep = 0;
        let startTime = ctx.currentTime;

        sweepOsc.start(ctx.currentTime);
        sweepRunning = true;
        btn.textContent = 'Stop';
        btn.classList.add('active');

        function scheduleNextStep() {
          if (!sweepRunning || currentStep >= steps) {
            stopSweep();
            document.getElementById('sweep-freq').textContent = 'Done';
            return;
          }

          currentStep++;
          const nextFreq = startFreq + (freqStep * currentStep);
          const nextTime = ctx.currentTime + stepDuration;
          
          sweepOsc.frequency.setValueAtTime(nextFreq, nextTime);
          
          document.getElementById('sweep-freq').textContent = Math.round(nextFreq) + ' Hz';
          document.getElementById('sweep-time').textContent = ((ctx.currentTime - startTime)).toFixed(1) + 's / ' + duration + 's';

          sweepTimeout = setTimeout(scheduleNextStep, stepDuration * 1000);
        }

        scheduleNextStep();
      }

      return {
        playChannel,
        playPhase,
        toggleMic,
        toggleSweep
      };
    })();

    window.soundTest = soundTest;

    function toggleTheme() {
      const html = document.documentElement;
      const btn = document.querySelector('.theme-toggle');
      if (html.getAttribute('data-theme') === 'light') {
        html.removeAttribute('data-theme');
        btn.textContent = 'Light';
      } else {
        html.setAttribute('data-theme', 'light');
        btn.textContent = 'Dark';
      }
    }
  </script>
</body>
</html>
